<!DOCTYPE html>
<html>
<head>
  <title>87-0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Launch Screen -->
<div id="launch-screen">
  <h1>87-0</h1>

  <p>
    Draft the greatest Counter-Strike roster in history and see if they can create an era.
  </p>

  <button onclick="startGame()">Start Game</button>

  <br><br>

  <button onclick="window.location.href='how-to-play.html'">
    How to Play
  </button>
</div>

<!-- Game Screen -->
<div id="game-screen" style="display:none;">

  <div id="sidebar">
    <a href="how-to-play.html">
      <button>How to Play</button>
    </a>
  </div>

  <h1>87-0</h1>

  <p>
    Draft 5 Counter-Strike players and see if they can create an era.
  </p>

  <h2 id="draft-title">Player Options</h2>

  <h3 id="role-needed"></h3>

  <div id="player-options"></div>

  <h2>Your Team</h2>

  <ul id="team-list"></ul>

  <button id="simulate-button" onclick="simulateEra()">
    Simulate Era
  </button>

  <h2 id="result"></h2>

  <div id="score-breakdown"></div>

  <button
    id="play-again-button"
    onclick="playAgain()"
    style="display:none;"
  >
    Play Again
  </button>

</div>

<script src="players.js"></script>
<script src="script.js"></script>

</body>
</html>
