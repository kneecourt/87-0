<!DOCTYPE html>
<html>
<head>
  <title>87-0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Launch Screen -->
<div id="launch-screen">
  <img src="87-0Logo.png" alt="87-0 Logo" class="game-logo">

  <p>
    Draft 5 Counter-Strike players from throughout history and see if they can create an era.
  </p>

  <button onclick="startGame()">Start Game</button>

  <br><br>

  <button onclick="window.location.href='how-to-play.html'">
    How to Play
  </button>
</div>

<!-- Game Screen -->
<div id="game-screen" style="display:none;">

  <div id="sidebar">
    <button onclick="window.location.href='how-to-play.html'">
      How to Play
    </button>
  </div>

  <img src="87-0Logo.png" alt="87-0 Logo" class="game-logo">

  <p>
    Draft 5 Counter-Strike players from throughout history and see if they can create an era.
  </p>

  <div id="slot-machine" style="display:none;">
    <div id="slot-team-name">Selecting Team...</div>
  </div>

  <div id="draft-title">Player Options</div>

  <h3 id="role-needed"></h3>

  <div id="player-options"></div>

  <button id="reroll-button" onclick="rerollTeam()">
    <span class="reroll-icon">⟳</span>
    <span class="reroll-text">Reroll</span>
  </button>

  <div id="team-section" style="display:none;">
    <h2>Your Team</h2>
    <ul id="team-list"></ul>
  </div>

  <button id="simulate-button" onclick="simulateEra()">
    Simulate Era
  </button>

  <h2 id="result"></h2>

  <div id="score-breakdown"></div>

  <button
    id="play-again-button"
    onclick="playAgain()"
    style="display:none;"
  >
    Play Again
  </button>

</div>

<script src="players.js"></script>
<script src="script.js"></script>

</body>
</html>
